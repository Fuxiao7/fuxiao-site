services:
  mysql:
    image: mysql:8.0
    container_name: fuxiao-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: fuxiao123
      MYSQL_DATABASE: fuxiao_admin
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - fuxiao-mysql-data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -pfuxiao123 --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  fuxiao-mysql-data:
