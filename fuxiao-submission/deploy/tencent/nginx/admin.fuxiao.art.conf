# 拂晓的投稿系统 · 管理台
# admin.fuxiao.art 只托管 Vue 构建产物；/api 与 /uploads 反代到本机后端。

server {
    listen 80;
    listen [::]:80;
    server_name admin.fuxiao.art;

    charset utf-8;
    client_max_body_size 25m;
    server_tokens off;

    root /srv/fuxiao/admin;
    index index.html;

    access_log /var/log/nginx/admin.fuxiao.art.access.log;
    error_log  /var/log/nginx/admin.fuxiao.art.error.log;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location ^~ /uploads/ {
        alias /srv/fuxiao/uploads/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location ^~ /media/ {
        alias /srv/fuxiao/app/public/media/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Vue Router history 模式
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|woff2?|png|jpe?g|webp|svg|ico)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }
}
