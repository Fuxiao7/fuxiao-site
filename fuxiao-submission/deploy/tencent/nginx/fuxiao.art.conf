# 拂晓和朋友们 · 主站
# 首次部署先走 HTTP，DNS 生效后执行：
#   sudo certbot --nginx -d fuxiao.art -d www.fuxiao.art -d admin.fuxiao.art
# certbot 会自动补 443 与跳转。

server {
    listen 80;
    listen [::]:80;
    server_name fuxiao.art www.fuxiao.art;

    charset utf-8;
    client_max_body_size 25m;
    server_tokens off;

    access_log /var/log/nginx/fuxiao.art.access.log;
    error_log  /var/log/nginx/fuxiao.art.error.log;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 后端 API
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 后台上传的图片（后台发布时会同步到 public/media，这里保留原始路径）
    location ^~ /uploads/ {
        alias /srv/fuxiao/uploads/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # 博客自带图片
    location ^~ /media/ {
        alias /srv/fuxiao/app/public/media/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # 公开投稿页在管理台；主站给一个短地址。
    location = /submit {
        return 302 https://admin.fuxiao.art/submit;
    }

    # Next.js
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
